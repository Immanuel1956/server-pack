# A backup's items, as they were. Nothing can be taken out.
# %target% %date% %ago% %items% %level% %trigger% %color% %world% %x% %y% %z% %note%
#
# layout: where the player's inventory is drawn. storage-start takes 27 slots (the main
# inventory), hotbar-start 9 slots, then the armour pieces and the offhand one slot each.

title: "&8⏱ %target% &7(%date%)"
rows: 6

layout:
  storage-start: 0
  hotbar-start: 27
  helmet: 36
  chestplate: 37
  leggings: 38
  boots: 39
  offhand: 40

items:

  spacer:
    slots: "41-44"
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    sound: ""

  bottom:
    slots: "46-48, 50-52"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""

  back:
    slot: 45
    function: back
    material: ARROW
    name: "%color%&lBACK"
    lore:
      - "&7The %trigger% backups."
      - ""
      - "&#FBE401▶ &l&nCLICK&r &#FBE401To Go Back"

  details:
    slot: 49
    material: BOOK
    name: "%color%&l%date%"
    lore:
      - "&8Description"
      - ""
      - "%color%Information:"
      - "%color%¦ &fItem &7¦ &f%items%"
      - "%color%¦ &fTrigger &7¦ &f%trigger%"
      - "%color%¦ &fLevel &7¦ &f%level%"
      - "%color%¦ &fWhere &7¦ &f%world% %x%, %y%, %z%"
      - "%color%¦ &fNote &7¦ &f%note%"
      - "%color%¦ &f%ago%"
    sound: ""

  restore:
    slot: 53
    function: restore
    material: LIME_STAINED_GLASS_PANE
    name: "&#97F900&lRESTORE"
    lore:
      - "&8Description"
      - ""
      - "&#97F900Information:"
      - "&#97F900¦ &fReplaces &#97F900%target%&f's inventory"
      - "&#97F900¦ &fwith this backup."
      - ""
      - "&#FBE401▶ &l&nCLICK&r &#FBE401To Restore"

sounds:
  open:
    enabled: true
    sound: "block.chest.open"
    volume: 0.7
    pitch: 1.2
  close:
    enabled: true
    sound: "block.chest.close"
    volume: 0.7
    pitch: 1.2
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 0.6
    pitch: 1.2
