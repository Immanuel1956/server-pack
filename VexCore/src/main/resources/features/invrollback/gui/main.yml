# /invrollback <player>: the four kinds of backup.
# %target%, and how many are saved: %auto% %joins% %deaths% %quits%. %auto_interval% = minutes.
# function: auto / joins / deaths / quits opens that kind's list.
#
# Every item takes: slot / slots, material, name, lore, glow, amount, custom-model-data,
# item-model, skull, permission, sound ("" = silent), close-on-click, and commands.

title: "&8⏱ Rollback | %target%"
rows: 3

items:

  auto:
    slot: 10
    function: auto
    material: CLOCK
    name: "&#FF0000&lAUTO"
    lore:
      - "&8Description"
      - ""
      - "&#FF0000Information:"
      - "&#FF0000¦ &fHere you can restore the"
      - "&#FF0000¦ &finv of the &#FF0000players &flast inv"
