# /settings menu.
#
# Every template below is one button, in this order, filling content-slots page by page.
#   permission: <node>  (optional) the button only shows for players with it, like its command.
#   toggle: <id>   shows %status% and flips that VexCore toggle when clicked. The button is
#                  hidden while the feature that owns the toggle is off (or not installed yet).
#   no toggle      the button only runs its commands - use it for other plugins' toggles.
# Add, remove, reorder and restyle freely. Every button takes commands:, left-commands:,
# right-commands:, permission: and sound:.
# Items are placed top to bottom, so a later item covers an earlier one in the same slot
# (the page arrows sit on top of the border and uncover it when hidden).
#
# Toggle ids: tpa, tpahere, tpauto, nightvision, playerhide, mobtoggle, phantoms, joinmessages,
#             deathmessages, live, chat, msg, mentions, pay, coinflip

title: "&8Settings | Dashboard &7[%page%/%pages%]"
rows: 4

content-slots: "10-16, 19-25"

# What %status% shows.
status-on: "&#16D223&lON"
status-off: "&#FF3B3B&lOFF"

items:

  border:
    slots: "0-9, 17, 18, 26-30, 32-35"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""

  previous-page:
    slot: 27
    function: previous-page
    material: RED_STAINED_GLASS_PANE
    name: "&#FF3B3B&lPREVIOUS PAGE"
    lore:
      - "&7Page &f%page%&7/&f%pages%"
      - ""
      - "&#FFD900▶ &n&lCLICK&r&#FFD900 to go back"

  close:
    slot: 31
    material: BARRIER
    name: "&#FF3B3B&lCLOSE"
    commands:
      - "[close]"

  next-page:
    slot: 35
    function: next-page
    material: LIME_STAINED_GLASS_PANE
    name: "&#16D223&lNEXT PAGE"
    lore:
      - "&7Page &f%page%&7/&f%pages%"
      - ""
      - "&#FFD900▶ &n&lCLICK&r&#FFD900 to go on"

