# Prestige: /prestige opens the menu; a level is taken by clicking it once it is ready.
# Levels are taken one after another. Admin: /prestige set <player> <level>
# Placeholders: %vexcore_prestige% (level), %vexcore_prestige_max%
#
# Every level (in file order) can ask for:
#   cost             money, TAKEN when the level is reached
#   kills            player kills in total (not taken)
#   playtime-hours   hours played in total (not taken)
# and gives:
#   invest-limit     added to the /invest limit for good
#   commands         command lines, e.g. "[console] lp user %player% parent add prestige1".
#                    %player% %level%
#   display          what the menu shows under Rewards (%rewards%)

prefix: "&#FF4D6D&lPRESTIGE &7▷ "

# Tell everybody when someone prestiges.
broadcast: true

no-next: "-"
no-rewards: "&f- &7none"

levels:
  "1":
    material: COAL
    cost: 250000
    kills: 0
    playtime-hours: 2
    invest-limit: 25000
    commands: []
    display:
