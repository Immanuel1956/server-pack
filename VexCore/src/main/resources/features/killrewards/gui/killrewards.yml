# /killrewards menu. reward-slots: one slot per reward, in order of what they need.
#
# Templates (the three states): locked, ready, claimed.
#   %required% %left% %rewards% (the reward's display lines, give it a line of its own)
# Everywhere: %progress% %claimed% %total% %ready% %next%.
#
# Every item and template takes: slot / slots, material, name, lore, glow, amount,
# custom-model-data, item-model, skull, permission, sound ("" = silent), close-on-click, and
# commands: / left-commands: / right-commands: ([player] [console] [message] [broadcast]
# [actionbar] [title] [sound] [chat] [refresh] [close]).

title: "&8☀ Kill | Rewards"
rows: 6

reward-slots: "10-16, 19-25, 28-34, 37-43"

items:

  border:
    slots: "0-9, 17, 18, 26, 27, 35, 36, 44-48, 50-53"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""

  info:
    slot: 49
    material: PLAYER_HEAD
    skull: "%player%"
    name: "&#FFEE00&lYOUR KILLS"
    lore:
      - "&8Statistics"
      - ""
      - "&#FFEE00¦ &fKills: &#FFEE00%progress%"
      - "&#FFEE00¦ &fClaimed: &#FFEE00%claimed%&7/&#FFEE00%total%"
      - "&#FFEE00¦ &fWaiting: &#FFEE00%ready%"
      - "&#FFEE00¦ &fNext in: &#FFEE00%next%"
    sound: ""

templates:

  locked:
    material: RED_DYE
    name: "&#FF3B3B&lLOCKED &r&#FF3B3B(%required% kills)"
    lore:
      - "&8Description"
      - ""
      - "&#FF3B3B¦ &fUnlocks in &#FF3B3B%left% &fkills"
      - ""
      - "&fRewards:"
      - "%rewards%"

  ready:
    material: YELLOW_DYE
    glow: true
    name: "&#FFEE00&lREADY &r&#FFEE00(%required% kills)"
    lore:
      - "&8Description"
      - ""
      - "&fRewards:"
      - "%rewards%"
      - ""
      - "&#FFD900▶ &n&lCLICK&r&#FFD900 to claim"

  claimed:
    material: LIME_DYE
    name: "&#80EE0B&lCLAIMED &r&#80EE0B(%required% kills)"
    lore:
      - "&8Description"
      - ""
      - "&fRewards:"
      - "%rewards%"

# ── Sounds ──────────────────────────────────────────────────────────────────
sounds:
  open:
    enabled: true
    sound: "block.chest.open"
    volume: 0.7
    pitch: 1.2
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 0.6
    pitch: 1.2
