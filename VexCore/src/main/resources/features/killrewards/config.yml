# /killrewards: rewards for player kills. Uses the server's own statistic, so earlier kills count.
# Placeholder: %vexcore_kills%
# Admin: /killrewards reset <player> (lets them claim everything again).
#
# Each reward is claimed once. The KEY of a reward is what gets recorded, so never rename a
# key that is in use, or it can be claimed a second time.
#   kills  what is needed (player kills, at least 1)
#   money      paid out (optional)
#   commands   command lines ([console] ..., [message] ...). %player% %reward% %required%
#   display    what the menu shows under Rewards (%rewards%)

prefix: "&#FFEE00&lKILLS &7▷ "

# Shown for %next% once everything is unlocked.
no-next: "-"
# Shown for %rewards% when a reward has no display lines.
no-rewards: "&f- &7none"

# Tells players when a new reward is waiting (checked every interval-seconds).
notify:
  enabled: true
  interval-seconds: 60

rewards:
  "1":
    kills: 1
    money: 500
    display:
      - "&f- &#80EE0B$500"
  "5":
    kills: 5
    money: 2500
    display:
      - "&f- &#80EE0B$2,500"
  "10":
    kills: 10
    money: 5000
    display:
      - "&f- &#80EE0B$5,000"
  "25":
    kills: 25
    money: 10000
    display:
      - "&f- &#80EE0B$10,000"
  "50":
    kills: 50
    money: 25000
    display:
      - "&f- &#80EE0B$25,000"
  "100":
    kills: 100
    money: 50000
    display:
      - "&f- &#80EE0B$50,000"
  "250":
    kills: 250
    money: 100000
    display:
      - "&f- &#80EE0B$100,000"
  "500":
    kills: 500
    money: 250000
    display:
      - "&f- &#80EE0B$250,000"

messages:
  claimed: "{prefix}&fYou claimed the &#FFEE00%required% kills &freward!"
  notify: "{prefix}&fYou have &#FFEE00%ready% &freward(s) waiting. &7/killrewards"
  locked: "&#FF0000&lERROR &7▷ &fThis reward unlocks in &#FFEE00%left% &fmore kills."
  already-claimed: "&#FF0000&lERROR &7▷ &fYou already claimed this reward."
  economy-missing: "&#FF0000&lERROR &7▷ &fThe money of this reward couldn't be paid out. Please tell staff."
  reset: "{prefix}&fReset the rewards of &#FFEE00%player%&f."

sounds:
  claimed:
    enabled: true
    sound: "entity.player.levelup"
    volume: 1.0
    pitch: 1.4
  notify:
    enabled: true
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.2
  locked:
    enabled: true
    sound: "block.note_block.bass"
    volume: 1.0
    pitch: 0.8
  already-claimed:
    enabled: true
    sound: "block.note_block.bass"
    volume: 1.0
    pitch: 0.8
