# /warps: every server warp. Click to warp. Placeholders on a warp: %name% %icon% %description%
# %world% %x% %y% %z%. Everywhere: %warps% %page% %pages% %player%.
title: "&8Warps [%page%/%pages%]"
rows: 6
content-slots: "10-16, 19-25, 28-34"
items:
  border:
    slots: "0-9, 17-18, 26-27, 35-36, 44-47, 49, 51-53"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""
  previous:
    slot: 48
    function: previous-page
    material: ARROW
    name: "&#3BC8FF▷ &fPrevious Page"
  next:
    slot: 50
    function: next-page
    material: ARROW
    name: "&#3BC8FF▷ &fNext Page"
  empty:
    slot: 22
    function: empty
    material: BARRIER
    name: "&#FF0000&lNO WARPS"
    lore: ["&7Staff haven't set any warps yet."]
templates:
  warp:
    material: "%icon%"
    name: "&#3BC8FF&l%name%"
    lore:
      - "&8Server Warp"
      - ""
      - "&#3BC8FF¦ &f%description%"
      - "&#3BC8FF¦ &fWorld: &#3BC8FF%world%"
      - ""
      - "&#3BC8FF▷ &n&lCLICK&r&#3BC8FF To Warp"
  warp-locked:
    material: GRAY_DYE
    name: "&7&l%name%"
    lore:
      - "&8Server Warp"
      - ""
      - "&#FF3B3B¦ &fLocked"
sounds:
  open: {sound: "block.ender_chest.open", volume: 0.6, pitch: 1.3}
  click: {sound: "ui.button.click", volume: 1.0, pitch: 1.2}
  page: {sound: "item.book.page_turn", volume: 1.0, pitch: 1.0}
