# Death messages by cause, in three groups. Players can hide them with /deathtoggle.
#
# %player% = who died, %killer% = the player or mob, %weapon% = the killer's item (by-player),
# %symbol% = the group's symbol below. A cause that is missing uses its group's default;
# an empty line ("") sends no message for that cause. Delete a whole group to keep
# Minecraft's own message for it.

prefix: "&#FF256E&lDEATH &7▷ "

# What players start with (true = messages shown).
default: true

symbols:
  by-player: "🗡"
  by-mob: "🏹"
  environment: "☠"

# %weapon% when the killer had nothing in hand.
fists: "their fists"
# Shown as %killer% when the killer is vanished.
hidden-killer: "Someone"

messages:
  shown: "{prefix}&fDeath messages are now &#16D223shown&f."
  hidden: "{prefix}&fDeath messages are now &#FF3B3Bhidden&f."

sounds:
  shown:
    enabled: true
    sound: "block.note_block.pling"
    volume: 0.8
    pitch: 1.6
  hidden:
    enabled: true
    sound: "block.note_block.pling"
    volume: 0.8
    pitch: 0.8

# Killed by a player. %weapon% = what the killer held.
by-player:
  entity-attack: "&#FF256E%symbol% &#FF256E%player% &fwas slain by &#FF256E%killer%&f &7using %weapon%"
  entity-sweep-attack: "&#FF256E%symbol% &#FF256E%player% &fwas cut down by &#FF256E%killer%&f &7using %weapon%"
  projectile: "&#FF256E%symbol% &#FF256E%player% &fwas shot by &#FF256E%killer%&f &7using %weapon%"
  fall: "&#FF256E%symbol% &#FF256E%player% &fwas knocked off a ledge by &#FF256E%killer%&f"
  void: "&#FF256E%symbol% &#FF256E%player% &fwas knocked into the void by &#FF256E%killer%&f"
  drowning: "&#FF256E%symbol% &#FF256E%player% &fdrowned fighting &#FF256E%killer%&f"
  lava: "&#FF256E%symbol% &#FF256E%player% &fwas pushed into lava by &#FF256E%killer%&f"
  fire: "&#FF256E%symbol% &#FF256E%player% &fwas set on fire by &#FF256E%killer%&f"
  fire-tick: "&#FF256E%symbol% &#FF256E%player% &fburned to death fighting &#FF256E%killer%&f"
  block-explosion: "&#FF256E%symbol% &#FF256E%player% &fwas blown up by &#FF256E%killer%&f"
  entity-explosion: "&#FF256E%symbol% &#FF256E%player% &fwas blown up by &#FF256E%killer%&f"
  magic: "&#FF256E%symbol% &#FF256E%player% &fwas killed with magic by &#FF256E%killer%&f"
