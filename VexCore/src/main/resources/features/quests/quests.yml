# money per difficulty. change these four blocks to rescale the whole board at once.
# a quest may override them with its own reward.money and reward.first-bonus.
rewards:
  easy:
    money: 25000
    first-bonus: 10000
  medium:
    money: 60000
    first-bonus: 25000
  hard:
    money: 150000
    first-bonus: 60000
  elite:
    money: 350000
    first-bonus: 150000

# weight decides how often a quest is drawn onto a board. an empty filter list counts everything.
