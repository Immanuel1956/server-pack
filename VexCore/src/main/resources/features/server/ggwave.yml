# /ggwave [time]: for a while every "gg" in chat turns into a coloured GG, and each player's
# first one gets the rewards. Store purchases can start a wave too (features/server/tebex.yml).
duration: "30s"
# Money paid for each player's first gg in a /ggwave wave. 0 = none. (Purchase waves set their own.)
money: 0
# What counts as a gg (regex).
match: "(?i)^\\s*g+\\s*g+\\s*!*\\s*$"
styles:
  - "<gradient:#FF0000:#FFD900>&lGG</gradient>"
  - "<gradient:#00E5FF:#A66CFF>&lGG</gradient>"
  - "<gradient:#97F900:#00E5FF>&lGG</gradient>"
  - "<rainbow>&lGG</rainbow>"
# Commands for each player's first gg, in every wave ([console] give %player% diamond 1 ...).
rewards: []
messages:
  started: "&#FFD900&lGG WAVE &7▷ &fType &#FFD900gg &ffor the next &#FFD900%time%&f!"
  ended: "&#FFD900&lGG WAVE &7▷ &fThe wave is over. &#FFD900%count% &fplayers joined in."
  usage: "&#FFD900&lGG WAVE &7▷ &fUse /ggwave [30s]"
  already-running: "&#FF0000&lERROR &7▷ &fA GG wave is already running."
  rewarded: "[actionbar]&#FFD900&lGG &7▷ &fYou got &#97F900%money% &ffor saying gg!"
sounds:
  started:
    sound: "ui.toast.challenge_complete"
    volume: 0.8
    pitch: 1.0
  rewarded:
    sound: "entity.player.levelup"
    volume: 0.6
    pitch: 1.6
