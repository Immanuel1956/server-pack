# /leaderboard [category]. Placeholders %vexcore_top_<category>_<place>_name% and _value%,
# e.g. %vexcore_top_kills_1_name%. Refreshed from the database every refresh-seconds.
size: 10
refresh-seconds: 120
empty-name: "---"
categories:
  kills: {enabled: true, title: "Kills"}
  deaths: {enabled: true, title: "Deaths"}
  best_streak: {enabled: true, title: "Best kill streak"}
  mob_kills: {enabled: true, title: "Mob kills"}
  blocks_broken: {enabled: true, title: "Blocks broken"}
  blocks_placed: {enabled: false, title: "Blocks placed"}
  duel_wins: {enabled: true, title: "1v1 wins"}
  duel_losses: {enabled: false, title: "1v1 losses"}
  ffa_kills: {enabled: true, title: "FFA kills"}
  balance: {enabled: true, title: "Richest"}
  prestige: {enabled: true, title: "Prestige"}
messages:
  categories: "&#FFD900&lTOP &7▷ &fCategories: &#FFD900%categories%"
  unknown-category: "&#FF0000&lERROR &7▷ &fNo category &#FFD900%category%&f. Try: %categories%"
  header: "&#FFD900&lTOP &7▷ &f%title%"
  line: "&8 #%place% &f%player% &7- &#FFD900%value%"
  empty: "&7Nobody yet."
