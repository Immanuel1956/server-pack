# Name tags, ported from LifestealCore: lines of text floating above every player's head.
# /nametags shows the settings, /nametags reload rebuilds every tag.
# The vanilla name tag is hidden (Paper; Folia has no scoreboards so it stays visible there).
# All lines of a player are one tag, one line under the other (they can't overlap).

# How the tag stays on the head:
#   FOLLOW  the server moves it onto the head every tick (sliding over teleport-duration).
#           Works on every server, needs no other plugin, and a tag that ever gets left behind
#           (portal, teleport) is put back within half a second. Recommended.
#   RIDE    players' games carry the tag on the head themselves (needs PacketEvents). The
#           smoothest, but if tags freeze in one place on your server, use FOLLOW.
mode: FOLLOW

# Ticks between updates. Only text that really changed is sent.
refresh: 10
# Ticks after joining before the tag goes up (other plugins set prefixes on join).
join-delay-ticks: 20

display:
  # #AARRGGBB, 00 alpha = no background. "#40000000" gives a light dark box like vanilla.
  background: "#00000000"
  brightness: 15
  view-distance: 48
  scale: 1.0
  # Blocks between the top of the head and the bottom line.
  y-offset: 0.3
  line-width: 1000
  # Ticks the tag takes to slide to the player's new spot (0-59). 2 matches how other players
  # move on your screen; 0 snaps.
  teleport-duration: 2
  text-opacity: 255
  see-through: false
  shadow: true
  hide-when-sneaking: true
  hide-when-invisible: true
  # true = you don't see your own tag (like vanilla).
  hide-own: true
  # A line that comes out empty (its placeholder had no answer) leaves no gap.
  hide-empty-lines: true

disabled-worlds: []

# Top to bottom. interval is how long a frame stands, refresh how often the row is looked at. Both
# in ticks, 20 is a second, and interval rounds up to a multiple of refresh. interval 0 never
# turns over. %player% plus every VexCore and PlaceholderAPI placeholder works; placeholders no
# plugin answers are left out.
lines:

  top:
    enabled: true
    interval: 0
    refresh: 100
    frames:
      - "%luckperms_prefix%&f%player% %luckperms_suffix%"

  bottom:
    enabled: true
    interval: 80
    frames:
      - "&#80ee0b&l$&r &#80ee0b%vexcore_balance_short% &7| &#F47714⚑ &#F47714%vexcore_team%"
      - "&#FF0000🗡 &#FF0000%vexcore_stats_kills% &7| &#FB7B0B☠ &#FB7B0B%vexcore_stats_deaths% &7| &#FFF300⌛ &#FFF300%vexcore_playtime%"

messages:
  info: "&#FF256E&lNAMETAGS &7▷ &fMode &#FF256E%mode% &7| &fLines &#FF256E%lines% &7| &fOffset &#FF256E%offset% &7| &fRefresh &#FF256E%refresh%"
  reloaded: "&#FF256E&lNAMETAGS &7▷ &fReloaded, &#FF256E%count% &ftags rebuilt."
