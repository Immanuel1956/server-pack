# Asked before joining a coinflip. function: confirm plays, function: cancel goes back.
# %player% = the creator, %amount% = the bet.
#
# Every item and template takes: slot / slots, material, name, lore, glow, amount,
# custom-model-data, item-model, skull, permission, sound ("" = silent), close-on-click, and
# commands: / left-commands: / right-commands: ([player] [console] [message] [broadcast]
# [actionbar] [title] [sound] [chat] [refresh] [close]).

title: "&8Bet %amount%?"
rows: 3

items:

  border:
    slots: "0-10, 12, 14, 16-26"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""

  confirm:
    slot: 11
    function: confirm
    material: LIME_CONCRETE
    name: "&#80EE0B&lPLAY"
    lore:
      - ""
      - "&fBet &#80EE0B%amount% &fagainst &#FFE925%player%"

  info:
    slot: 13
    material: PLAYER_HEAD
    skull: "%player%"
    name: "&#FFE925&l%player%"
    lore:
      - "&#80EE0B$ &fBet: &#80EE0B%amount%"
    sound: ""

  cancel:
    slot: 15
    function: cancel
    material: RED_CONCRETE
    name: "&#FF3B3B&lBACK"

# ── Sounds ──────────────────────────────────────────────────────────────────
sounds:
  open:
    enabled: true
    sound: "block.barrel.open"
    volume: 0.7
    pitch: 1.2
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 0.6
    pitch: 1.2
  page:
    enabled: true
    sound: "item.book.page_turn"
    volume: 1.0
    pitch: 1.0
