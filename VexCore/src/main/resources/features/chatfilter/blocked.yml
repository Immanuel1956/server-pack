# Chat filter rules. Generated from tools/gen_blocked.py; edit here or there.
#
# A CANCEL hit anywhere stops the message; otherwise every REPLACE hit is masked; a WARN only alerts.
#
# Every rule runs three times: on the raw message; on a folded copy where accents, zalgo,
# invisible characters, look-alike letters from other alphabets (Cyrillic, Greek, fullwidth,
# small caps, fancy fonts) and leetspeak (4 a, 3 e, 1 i, 0 o, $ s, @ a, 7 t, 5 s, 8 b, | i...) are
# turned back into plain letters and every other character becomes a word break; and on a copy
# where short pieces are glued back together, so "f u c k" reads as one word while "who read"
# stays two. A hit made only of digits never counts (prices like 455 or 7175 stay clean).
#
# action   REPLACE masks the hit, CANCEL drops the message, WARN only reports
# alert    sends it to everyone with vexcore.chatfilter.alerts
# bypass   a permission that skips this rule, "" means nobody skips it
# strikes  how many strikes a hit adds (config.yml: strikes), default 1, WARN rules 0
# commands console commands run on every hit (%player% %uuid% %rule%), default none
#
# /chatfilter regex <word> adds a pattern to CUSTOM, /chatfilter remove <word> takes it out,
# /chatfilter test <message> shows which rule catches a message, /chatfilter reload re-reads this.

# Innocent words that contain a caught one. These are never caught, in any rule.
exceptions:
  - "moby dick"
  - "scunthorpe"
  - "shitake"
  - "shitakes"
  - "cocktail"
  - "cocktails"
  - "cockatoo"
  - "cockatoos"
  - "cockpit"
  - "cockpits"
  - "peacock"
  - "peacocks"
  - "hancock"
  - "dickens"
  - "dickson"
  - "dickinson"
  - "pussycat"
  - "pussywillow"
  - "analysis"
  - "analyst"
  - "sussex"
  - "essex"
  - "middlesex"
  - "therapist"
  - "therapists"
  - "grapes"
  - "cumulative"
  - "cumbersome"
  - "document"
  - "specialist"
  - "raccoon"
  - "cocoon"
  - "japan"
  - "japanese"
  - "nigeria"
  - "niger"
  - "snigger"
  - "sniggering"
  - "niggle"
  - "niggling"
  - "assassin"
  - "assassins"
  - "hitchcock"
  - "babcock"
  - "woodcock"
  - "shuttlecock"
  - "weathercock"
  - "titmouse"
  - "sexton"
  - "sextant"
  - "fukushima"
  - "fukuoka"

rules:

  # E-mail addresses and phone numbers, so players can't dox each other (or themselves).
  PERSONAL_INFO:
    enabled: true
    action: CANCEL
    alert: true
    bypass: "vexcore.chatfilter.bypass.personalinfo"
    strikes: 0
    patterns:
      - "(?<![\\p{L}\\p{N}._%+-])[\\p{L}\\p{N}._%+-]{1,64}@[\\p{L}\\p{N}-]{1,63}(\\.[\\p{L}\\p{N}-]{1,63})*\\.[\\p{L}]{2,24}(?![\\p{L}\\p{N}])"
      - "(?<![\\p{N}])\\+?\\(?\\d{3}\\)?[\\s.-]\\d{3}[\\s.-]\\d{4}(?![\\p{N}])"
      - "(?<![\\p{N}+])\\+\\d{1,3}[\\s.-]?\\d{2,4}[\\s.-]?\\d{3,4}[\\s.-]?\\d{3,4}(?![\\p{N}])"

  # Server, site and IP adverts, also written "site . com", "site [dot] com" and "1 2 7 . 0 . 0 . 1".
  ADVERTISING:
    enabled: true
    action: CANCEL
    alert: true
    bypass: "vexcore.chatfilter.bypass.advertising"
    patterns:
      - "(?<![\\p{L}\\p{N}.])(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])([.,_-])(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\2(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\2(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?![\\p{L}\\p{N}.])"
      - "(?<![\\p{L}\\p{N}.])(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\s*\\.\\s*(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\s*\\.\\s*(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\s*\\.\\s*(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?![\\p{L}\\p{N}.])"
      - "(?<![\\p{L}\\p{N}])[\\p{L}\\p{N}][\\p{L}\\p{N}-]{1,30}+\\.(com|net|org|de|eu|gg|io|me|xyz|club|shop|fun|online|store|site|top|pro|live|tv|co|uk|nl|pl|ru|info|link|space|world|us|ca|au|fr|es|it|dev|app|host|games|network|mc|pw|cc|lol|one|vip|win|su|tk|ml|ga|cf|gq|icu|to|ly|gl|sh|biz)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])[\\p{L}\\p{N}][\\p{L}\\p{N}-]{1,30}+\\s*\\.\\s*(com|net|org|xyz|club|pw|cc|tk|ml|ga|cf|gq|icu|su|online|site|host|network)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])[\\p{L}\\p{N}][\\p{L}\\p{N}-]{1,30}+[\\s(\\[{]+d+[o0]+t+[\\s)\\]}]+(com|net|org|de|eu|gg|io|me|xyz|club|shop|fun|online|store|site|top|pro|live|tv|co|uk|nl|pl|ru|info|link|space|world|us|ca|au|fr|es|it|dev|app|host|games|network|mc|pw|cc|lol|one|vip|win|su|tk|ml|ga|cf|gq|icu|to|ly|gl|sh|biz)(?![\\p{L}\\p{N}])"

  # Links and Discord invites.
  LINKS:
    enabled: true
    action: CANCEL
    alert: true
    bypass: "vexcore.chatfilter.bypass.links"
    patterns:
      - "(?<![\\p{L}\\p{N}])https?\\s?:\\s?//\\S+"
      - "(?<![\\p{L}\\p{N}])www\\s?\\.\\s?\\S+"
      - "(?<![\\p{L}\\p{N}])(discord(app)?\\s*[.,]?\\s*(gg|com\\s*/\\s*invite|me)|dsc\\s*[.,]\\s*gg|invite\\s*[.,]\\s*gg)(?![\\p{L}\\p{N}])"

  # Racial, ethnic, homophobic, transphobic and ableist slurs. Always dropped.
  SLURS:
    enabled: true
    action: CANCEL
    alert: true
    bypass: ""
    strikes: 3
    patterns:
      - "(?<![\\p{L}\\p{N}])n+i+g+g+a+(?:s|z|h|hs)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])n+i+g+a+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])n+i+g+g+(?:a|as|az|ah|er|ers|uh)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])n+i+g+r+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])n+i+g+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])n+i+g+l+e+t+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])n+e+g+r+o+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])j+i+g+a+b+o+o+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])j+i+g+g+a+b+o+o+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+a+m+b+o+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])d+a+r+k+i+e+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])d+a+r+k+y+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])c+o+o+n+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])g+o+l+l+i+w+o+g+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+h+e+b+o+o+n+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+p+i+c+(?:s|k|ks)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+p+i+c+k+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])w+e+t+b+a+c+k+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])b+e+a+n+e+r+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])k+i+k+e+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])k+y+k+e+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])h+e+e+b+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])h+y+m+i+e+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])c+h+i+n+k+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])c+h+i+n+k+y+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])g+o+o+k+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])z+i+p+p+e+r+h+e+a+d+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])j+a+p+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+a+g+h+e+a+d+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])t+o+w+e+l+h+e+a+d+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])p+a+k+i+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])w+o+g+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])w+o+p+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])d+a+g+o+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])p+o+l+a+c+k+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+e+d+s+k+i+n+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])i+n+j+u+n+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+q+u+a+w+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])h+a+l+f+b+r+e+e+d+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])a+b+b+o+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])b+o+o+n+g+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])g+y+p+p+o+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])f+a+g+g+o+t+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])f+a+g+o+t+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])f+a+g+(?:s|z|got|gots|gy)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])f+a+g+g+y+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])d+y+k+e+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])l+e+s+b+o+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])t+r+a+n+n+y+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])t+r+a+n+n+i+e+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+h+e+m+a+l+e+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+e+t+a+r+d+(?:s|ed|ation)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+e+t+a+r+d+e+d+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])t+a+r+d+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+p+a+z+(?:s|es|ed|ing|y|tic|tics)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])m+o+n+g+o+l+o+i+d+(?:s|z|es)?(?![\\p{L}\\p{N}])"
      - "(?<!s)n+i+g+g+(?:e+r+|a+h*|u+h+)[\\p{L}\\p{N}]*"
      - "[\\p{L}\\p{N}]*?f+a+g+g+o+t+[\\p{L}\\p{N}]*"
      - "(?<![\\p{L}\\p{N}])porch\\s*monkeys?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])jungle\\s*bunn(?:y|ies)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])camel\\s*jockeys?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])sand\\s*n+i+g+g+e+r+s?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])tar\\s*bab(?:y|ies)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])slant\\s*eyes?(?![\\p{L}\\p{N}])"

  # Hate speech and extremist slogans. Always dropped.
  HATE:
    enabled: true
    action: CANCEL
    alert: true
    bypass: ""
    strikes: 3
    patterns:
      - "(?<![\\p{L}\\p{N}])heil\\s*hitler(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])sieg\\s*heil(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])white\\s*power(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])white\\s*pride\\s*world\\s*wide(?![\\p{L}\\p{N}])"
      - "(?<![\\d.])14\\s*[/\\\\|-]\\s*88(?![\\d.])"
      - "(?<![\\d.$])14\\s+88(?![\\d.])"
      - "(?<![\\p{L}\\p{N}])gas\\s*the\\s*(jews?|blacks|muslims?|gays?|trans|asians?|mexicans?|whites|christians?|arabs?|n+i+g+g+e+r+s?|k+i+k+e+s?|f+a+g+g*o*t*s?)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])kill\\s*(all\\s*)?(the\\s*)?(jews?|blacks|muslims?|gays?|trans|asians?|mexicans?|whites|christians?|arabs?|n+i+g+g+e+r+s?|k+i+k+e+s?|f+a+g+g*o*t*s?)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])(jews?|blacks|muslims?|gays?|trans|asians?|mexicans?|whites|christians?|arabs?|n+i+g+g+e+r+s?|k+i+k+e+s?|f+a+g+g*o*t*s?)\\s*(should|must|need\\s*to|deserve\\s*to)\\s*(die|burn|be\\s*killed|be\\s*gassed|hang)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])holocaust\\s*(was\\s*)?(fake|a\\s*hoax|a\\s*lie|never\\s*happened|didn\\s*t\\s*happen)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])race\\s*wars?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])k+k+k+(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])hang\\s*(all\\s*)?(the\\s*)?(jews?|blacks|muslims?|gays?|trans|asians?|mexicans?|whites|christians?|arabs?|n+i+g+g+e+r+s?|k+i+k+e+s?|f+a+g+g*o*t*s?)(?![\\p{L}\\p{N}])"

  # Telling people to hurt themselves, doxxing, swatting and DDoS threats. PvP talk like "I'll kill you" is fine.
  THREATS:
    enabled: true
    action: CANCEL
    alert: true
    bypass: ""
    strikes: 2
    patterns:
      - "(?<![\\p{L}\\p{N}])k+y+s+(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])k+m+s+(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])k+i+l+l+\\s*(your|ur|yo|you|u)\\s*(self|selves|slf)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])(hang|neck|shoot|end|off|rope|unalive|stab|drown)\\s*(your|ur|yo|you|u)\\s*(self|selves|slf)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])(go|pls|please)\\s*die(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])hope\\s*(you|u|ya|yu)\\s*(die|get\\s*cancer|get\\s*hit\\s*by\\s*a\\s*(car|bus|truck))(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])drink\\s*bleach(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])(get|go)\\s*cancer(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])commit\\s*(die|suicide|sudoku|toaster\\s*bath)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])(i\\s*will|ill|i\\s*ll|im\\s*gonna|i\\s*m\\s*gonna|i\\s*am\\s*going\\s*to|gonna)\\s*(dox+|swat|ddos)\\s*(you|u|ya|yu)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])(dox+|swat|ddos)(ed|ing)?\\s*(you|u|ur|your)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])(kill|find)\\s*(you|u|ya|yu)\\s*irl(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])i\\s*know\\s*where\\s*(you|u|ya|yu)\\s*live(?![\\p{L}\\p{N}])"

  # Rape, paedophilia and child abuse. Always dropped.
  SEXUAL_VIOLENCE:
    enabled: true
    action: CANCEL
    alert: true
    bypass: ""
    strikes: 2
    patterns:
      - "(?<![\\p{L}\\p{N}])r+a+p+e+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+a+p+i+n+g+(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+a+p+i+s+t+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+a+p+e+d+(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+a+p+e+y+(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])p+e+d+o+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])p+e+d+o+p+h+i+l+e+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])p+e+d+o+p+h+i+l+i+a+(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])p+a+e+d+o+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])p+a+e+d+o+p+h+i+l+e+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])m+o+l+e+s+t+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])m+o+l+e+s+t+e+r+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])l+o+l+i+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
