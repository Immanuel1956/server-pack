# Money giveaway: how much to give away. %min% %max% %balance% work.
# MiniMessage or & colours. buttons: each is a text, or text + hover (shown when the mouse is
# on it) + width. Escape counts as cancel. Servers before 1.21.7 have no dialogs: the matching
# *-prompt message in ../../config.yml is sent instead and the answer is typed in the chat.

title: "<#FFB02E><b>MONEY GIVEAWAY</b>"
body:
  - "<gray>How much do you want to give away?"
  - "<gray>From <white>%min%</white> to <white>%max%</white>. You have <green>%balance%</green>."
  - "<dark_gray>1000, 2.5k and 1m all work."
body-width: 250
button-width: 150
can-close-with-escape: true

input:
  label: "Amount"
  label-visible: true
  width: 200
  max-length: 16

buttons:
  confirm:
    text: "<#FFB02E>Next"
    hover: "<gray>Choose how long the giveaway runs"
  cancel:
    text: "Cancel"
    hover: "<gray>Back"

sounds:
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 1.0
    pitch: 1.2
