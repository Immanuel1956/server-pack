# /sell menu.
#
#   sell-slots       where players put the items to sell (and take them back out)
#   function: sell   sells everything sellable in the slots now
#   summary          the item in the middle: what everything in the slots sells for, updated as
#                    items go in and out (%total% %items% %kinds% %lines% %multiplier%)
# Items that can't be sold don't go in: they stay where they were, with the anvil sound and the
# refused message (config.yml). What is left in the slots when the menu closes is sold
# (sell-on-close in config.yml) or given back. Nothing is ever lost. Keep buttons out of the
# sell slots. %multiplier% works in every item.

title: "&8Sell | Items"
rows: 6

sell-slots: "0-44"

# The item-by-item list in the summary (%lines%): one line per kind of item.
summary:
  # %amount% %item% %money%
  line: "&7• &f%amount%x %item% &7▸ &#80EE0B%money%"
  # At most this many lines, then the "more" line.
  max-lines: 8
  more: "&7...and %more% more"
  empty: "&7Nothing yet: put items above."

items:

  border:
    slots: "45-46, 48, 50, 52-53"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""

  info:
    slot: 47
    material: BOOK
    name: "&#80EE0B&lHOW IT WORKS"
    lore:
      - "&8Description"
      - ""
      - "&#80EE0BInformation:"
      - "&#80EE0B¦ &fPut items in the slots above"
      - "&#80EE0B¦ &fand close the menu to sell them."
      - "&#80EE0B¦ &fTake anything back out before that."
      - "&#80EE0B¦ &fYour multiplier: &#80EE0B%multiplier%x"
      - ""
      - "&7Items that can't be sold don't go in."

  # The middle: hover to see what it all sells for.
  summary:
    slot: 49
    material: GOLD_INGOT
    name: "&#FFD900&lMONEY RECEIVE: &#80EE0B%total%"
    sound: ""
    lore:
      - "&8What the items above sell for"
      - ""
      - "%lines%"
      - ""
      - "&#FFD900Money Receive: &#80EE0B%total%"
      - "&7%items% items &8· &7multiplier %multiplier%x"

  sell:
    slot: 51
    function: sell
    material: EMERALD
    glow: true
    name: "&#80EE0B&lSELL"
    lore:
      - "&8Description"
      - ""
      - "&#80EE0BInformation:"
      - "&#80EE0B¦ &fSells everything that can"
      - "&#80EE0B¦ &fbe sold right now for"
      - "&#80EE0B¦ &#80EE0B%total%&f."
      - ""
      - "&#FFD900▶ &n&lCLICK&r&#FFD900 to sell"

# ── Sounds ──────────────────────────────────────────────────────────────────
sounds:
  open:
    enabled: true
    sound: "block.chest.open"
    volume: 0.7
    pitch: 1.2
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 0.6
    pitch: 1.2
