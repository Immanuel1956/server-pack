# Selling items: /sell (menu), /sell hand, /sell all, /worth [item], /worth toggle
# Staff: /sell price <amount> [item] sets a price (the held item when no item is named),
#        /sell price remove [item] takes an item out (vexcore.sell.admin).
#
# Prices are in prices.yml, next to this file: every item a survival player can get has one.
# Items are only taken once the money is paid. If paying fails (no economy, frozen balance,
# maximum balance) everything stays or goes back where it was. Shulker boxes, bundles and other
# containers that still hold items are never sold.
#
# Placeholder: %vexcore_sell_multiplier%

prefix: "&#80EE0B&lSELL &7▷ "

decimals: 2

# Closing the sell menu sells what's in it. false = only the SELL button sells; whatever is left
# when the menu closes always goes back to the player.
sell-on-close: true

# Nobody sells in these game modes: items made in creative would be unlimited money. Whatever is
# in the sell menu goes back instead.
blocked-gamemodes: [CREATIVE, SPECTATOR]

sell-all:
  # /sell all also sells the hotbar. Armour and the offhand are never sold by /sell all.
  hotbar: true

# Items with a custom name, lore, custom model data or item model are usually special
# (crate rewards, custom weapons). false = they can't be sold at all.
sell-custom-items: false
# false = enchanted items can't be sold.
sell-enchanted: true
# Damaged tools and armour: FULL (full price), SCALE (price times the durability left), NONE (not sold)
damaged: SCALE

# The highest multiplier a player has the permission for is used. Without any it is 1.
multipliers:
  vip:
    permission: "vexcore.sell.multiplier.vip"
    value: 1.25
  mvp:
    permission: "vexcore.sell.multiplier.mvp"
    value: 1.5
  elite:
    permission: "vexcore.sell.multiplier.elite"
    value: 2.0

# Who may use /sell price.
admin-permission: "vexcore.sell.admin"

# Never sold, whatever prices.yml says: items survival players can't get (creative and commands
# only). * matches anything: "*_SPAWN_EGG" is every spawn egg.
unobtainable:
  - BEDROCK
  - BARRIER
  - LIGHT
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - SPAWNER
  - TRIAL_SPAWNER
  - VAULT
  - END_PORTAL_FRAME
  - REINFORCED_DEEPSLATE
  - BUDDING_AMETHYST
  - PETRIFIED_OAK_SLAB
  - PLAYER_HEAD
  - FARMLAND
  - DIRT_PATH
  - FROGSPAWN
  - CHORUS_PLANT
  - TEST_BLOCK
  - TEST_INSTANCE_BLOCK
  - SUSPICIOUS_SAND
  - SUSPICIOUS_GRAVEL
  - "*_SPAWN_EGG"
  - "INFESTED_*"

# ── Worth in tooltips ──────────────────────────────────────────────────────
# Hover over any item to see what it sells for. Only what the player's game SHOWS changes: the
# item itself (its NBT/data) is never touched, so items keep stacking with each other no matter
# where they came from, and nothing is left behind when this is turned off.
# Needs the PacketEvents plugin. Players hide it for themselves with /worth toggle.
worth-lore:
  enabled: true
  # Added under the item's own lore. %worth% = the whole stack (3 carrots at $2 = $6),
  # %each% = one item, %amount% = how many, %multiplier% = the player's sell multiplier.
  lines:
    - ""
    - "&7Worth: &#80EE0B%worth%"
  # For a single item instead ([] = use lines above).
  single-lines: []
  # For items that can't be sold (named, unobtainable, holding items...). %reason%.
  # [] = nothing added.
  unsellable-lines: []
  # Where tooltips show it. Other plugins' menus and VexCore's own buttons never do.
  show-in:
    inventory: true
    # Chests, barrels, shulker boxes, hoppers, minecarts, donkeys, ender chests.
    containers: true
    # The item slots of /sell.
    sell-menu: true
  # Creative sends items back to the server as the game shows them: no lines there.
  hidden-gamemodes: [CREATIVE, SPECTATOR]

# How the reasons in not-sellable are written.
reasons:
  no-price: "it has no price"
  unobtainable: "it can't be obtained in survival"
  custom: "it is a special item"
  enchanted: "it is enchanted"
  damaged: "it is damaged"
  has-contents: "it still holds items"
  worthless: "it is worth nothing"

# %amount% = items sold, %money% = what they paid, %multiplier%
messages:
  gamemode-blocked: "&#FF0000&lERROR &7▷ &fYou can't sell in %gamemode% mode."
  sold: "{prefix}&fSold &#80EE0B%amount% &fitems for &#80EE0B%money% &7(%multiplier%x)"
  nothing: "&#FF0000&lERROR &7▷ &fThere is nothing here that can be sold."
  returned: "[actionbar]{prefix}&fWhat wasn't sold went back to your inventory."
  payment-failed: "&#FF0000&lERROR &7▷ &fThe money couldn't be paid, so nothing was sold."
  hand-empty: "&#FF0000&lERROR &7▷ &fHold the item you want to sell."
  not-sellable: "&#FF0000&lERROR &7▷ &#80EE0B%item% &fcan't be sold: %reason%."
  unknown-item: "&#FF0000&lERROR &7▷ &#80EE0B%item% &fis not an item."
  worth: "{prefix}&#80EE0B%item% &7x%count% &fis worth &#80EE0B%total% &7(%each% each, %multiplier%x)"
  # Put into /sell but it can't be sold: it stays where it was.
  refused: "&#FF0000&lERROR &7▷ &#80EE0B%item% &fcan't be sold: %reason%."
  worth-on: "{prefix}&fItems show their worth again."
  worth-off: "{prefix}&fItems no longer show their worth."
  price-usage: "{prefix}&f/sell price <amount> [item] &7or &f/sell price remove [item] &7(the held item when none is named)"
  price-set: "{prefix}&#80EE0B%item% &fnow sells for &#80EE0B%price% &feach.%unobtainable%"
  price-removed: "{prefix}&#80EE0B%item% &fcan no longer be sold."

words:
  # Added to price-set for an item on the unobtainable list.
  unobtainable-note: " &7(It is on the unobtainable list in config.yml, so it still won't sell.)"

sounds:
  # The anvil breaking: this item can't go into /sell.
  refused:
    enabled: true
    sound: "block.anvil.destroy"
    volume: 0.8
    pitch: 1.0
  price-set:
    enabled: true
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.2
  price-removed:
    enabled: true
    sound: "entity.item.break"
    volume: 0.8
    pitch: 1.0
  sold:
    enabled: true
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.0
  nothing:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0
  payment-failed:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0
  hand-empty:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0
  not-sellable:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0
  unknown-item:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0
  worth:
    enabled: true
    sound: "block.note_block.pling"
    volume: 0.8
    pitch: 1.2
