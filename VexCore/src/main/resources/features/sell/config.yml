  no-price: "it has no price"
  custom: "it is a special item"
  enchanted: "it is enchanted"
  damaged: "it is damaged"
  has-contents: "it still holds items"
  worthless: "it is worth nothing"

# %amount% = items sold, %money% = what they paid, %multiplier%
messages:
  gamemode-blocked: "&#FF0000&lERROR &7▷ &fYou can't sell in %gamemode% mode."
  sold: "{prefix}&fSold &#80EE0B%amount% &fitems for &#80EE0B%money% &7(%multiplier%x)"
  nothing: "&#FF0000&lERROR &7▷ &fThere is nothing here that can be sold."
  returned: "[actionbar]{prefix}&fWhat wasn't sold went back to your inventory."
  payment-failed: "&#FF0000&lERROR &7▷ &fThe money couldn't be paid, so nothing was sold."
  hand-empty: "&#FF0000&lERROR &7▷ &fHold the item you want to sell."
  not-sellable: "&#FF0000&lERROR &7▷ &#80EE0B%item% &fcan't be sold: %reason%."
  unknown-item: "&#FF0000&lERROR &7▷ &#80EE0B%item% &fis not an item."
  worth: "{prefix}&#80EE0B%item% &7x%count% &fis worth &#80EE0B%total% &7(%each% each, %multiplier%x)"

