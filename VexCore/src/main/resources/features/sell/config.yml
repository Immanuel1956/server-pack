# Selling items: /sell (menu), /sell hand, /sell all, /worth [item]
#
# Items are only taken once the money is paid. If paying fails (no economy, frozen balance,
# maximum balance) everything stays or goes back where it was. Shulker boxes, bundles and other
# containers that still hold items are never sold.
#
# Placeholder: %vexcore_sell_multiplier%

prefix: "&#80EE0B&lSELL &7▷ "

decimals: 2

# Closing the sell menu sells what's in it. false = only the SELL button sells; whatever is left
# when the menu closes always goes back to the player.
sell-on-close: true

# Nobody sells in these game modes: items made in creative would be unlimited money. Whatever is
# in the sell menu goes back instead.
blocked-gamemodes: [CREATIVE, SPECTATOR]

sell-all:
  # /sell all also sells the hotbar. Armour and the offhand are never sold by /sell all.
  hotbar: true

# Items with a custom name, lore, custom model data or item model are usually special
# (crate rewards, custom weapons). false = they can't be sold at all.
sell-custom-items: false
# false = enchanted items can't be sold.
sell-enchanted: true
# Damaged tools and armour: FULL (full price), SCALE (price times the durability left), NONE (not sold)
damaged: SCALE

# The highest multiplier a player has the permission for is used. Without any it is 1.
multipliers:
  vip:
    permission: "vexcore.sell.multiplier.vip"
    value: 1.25
  mvp:
    permission: "vexcore.sell.multiplier.mvp"
    value: 1.5
  elite:
    permission: "vexcore.sell.multiplier.elite"
    value: 2.0

