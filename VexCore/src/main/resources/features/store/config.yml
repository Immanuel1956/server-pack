  - "&7[ɪɴғᴏʀᴍᴀᴛɪᴏɴ]"
  - ""
  - "&#97F900¦ &fKeep the server alive and grab"
  - "&#97F900¦ &f&#97F900ranks&f, &#97F900keys &fand more in return!"
  - ""
  - "&#97F900▷ &fLink: &#97F900&n%url%"

