# /media menu: how creators apply for the media rank. Add a block per platform.
#
# Every item:  slot / slots, material, name, lore, glow, custom-model-data, item-model,
#              skull, amount, permission (hidden without it), sound (its own click sound,
#              "" = silent), close-on-click, and
#              commands: / left-commands: / right-commands: - lines like
#                [player] spawn          [console] give %player% dirt
#                [message] &aHi          [broadcast] &e%player% did a thing
#                [actionbar] text        [title] Title|Subtitle
#                [sound] name;vol;pitch  [chat] hello   [refresh]   [close]
#              A line without [type] is run by the player.

