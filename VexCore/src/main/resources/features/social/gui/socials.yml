# /socials menu: every button runs one of the social commands.
#
# Every item:  slot / slots, material, name, lore, glow, custom-model-data, item-model,
#              skull, amount, permission (hidden without it), sound (its own click sound,
#              "" = silent), close-on-click, and
#              commands: / left-commands: / right-commands: - lines like
#                [player] discord        [console] give %player% dirt
#                [message] &aHi          [close]   [refresh]
# A button for a command you turned off in config.yml or commands.yml does nothing useful:
# remove it here too.

title: "&8Socials | Links"
rows: 3

items:

  border:
    slots: "0-9, 17-26"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""

  discord:
