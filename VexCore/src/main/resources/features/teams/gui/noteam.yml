# /team without a team: create one, or join a team that invited you.
# invite: %team% %owner% %members% %online%. Everywhere: %limit% %cost% (create-cost).
#
# Every item and template takes: slot / slots, material, name, lore, glow, amount,
# custom-model-data, item-model, skull, permission, sound ("" = silent), close-on-click, and
# commands: / left-commands: / right-commands: ([player] [console] [message] [broadcast]
# [actionbar] [title] [sound] [chat] [refresh] [close]).

title: "&8ᴛᴇᴀᴍs"
rows: 3

content-slots: "13-16"

items:

  filler:
    slots: "0-10, 12, 17-21, 23-26"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""

  create:
    slot: 11
    function: create
    material: NETHER_STAR
    name: "&#FF00F8&lCREATE A TEAM"
    lore:
      - "&8Description"
      - ""
      - "&#FF00F8Information"
      - "&#FF00F8¦ &fClick here and type"
      - "&#FF00F8¦ &fthe name in the chat!"
      - "&#FF00F8¦ &fUp to &#FF00F8%limit% &fmembers."
      - ""
      - "&#FBE401▶ &l&nCLICK&r &#FBE401to Create"

  no-invites:
    slot: 14
    function: no-invites
    material: PAPER
    name: "&#FF0000&lNO INVITES"
    lore:
      - "&8Description"
      - ""
      - "&#FF0000Information"
      - "&#FF0000¦ &fNobody invited you yet."
      - "&#FF0000¦ &fInvites show up here."
    sound: ""

  close:
    slot: 22
    material: BARRIER
    name: "&#FF0000&lCLOSE"
    commands:
      - "[close]"

templates:

  invite:
    material: WHITE_BANNER
    name: "&#FF00F8&l%team%"
    lore:
      - "&8Invite"
      - ""
      - "&#FF00F8Information"
      - "&#FF00F8¦ &fOwner: &#FF00F8%owner%"
      - "&#FF00F8¦ &fMembers: &#FF00F8%members% &7(%online% online)"
      - ""
      - "&#FBE401▶ &l&nCLICK&r &#FBE401to Join"

sounds:
  open:
    enabled: true
    sound: "block.note_block.pling"
    volume: 1.0
    pitch: 1.2
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 1.0
    pitch: 1.2
