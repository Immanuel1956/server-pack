# Kit preview. The kit's items are shown over content-slots (paged when there are more).
# They can only be looked at, never taken.
#   function: back    back to the kit list
#   function: claim   claims the kit
#   %kit% %key% %money% %cooldown% %status%

title: "&8Kit | %kit%"
rows: 6

content-slots: "0-44"

items:

  border:
    slots: "46-47, 51-52"
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    sound: ""

  back:
    slot: 45
    function: back
    material: ARROW
    name: "&#22AFFB&l← BACK"

  previous:
    slot: 48
    function: previous-page
    material: ARROW
    name: "&#22AFFB&l← PREVIOUS"

  claim:
    slot: 49
    function: claim
    material: LIME_DYE
    name: "&#80EE0B&lCLAIM"
    lore:
      - "&8Kit"
      - ""
      - "&#80EE0BInformation:"
      - "&#80EE0B¦ &fStatus: %status%"
      - "&#80EE0B¦ &fCooldown: &#80EE0B%cooldown%"
      - ""
      - "&#FFD900▶ &n&lCLICK&r&#FFD900 to claim"

  next:
    slot: 50
    function: next-page
    material: ARROW
    name: "&#22AFFB&lNEXT →"

  close:
    slot: 53
    material: BARRIER
    name: "&#FF3B3B&lCLOSE"
    close-on-click: true

# ── Sounds ──────────────────────────────────────────────────────────────────
sounds:
  open:
    enabled: true
    sound: "item.armor.equip_generic"
    volume: 0.7
    pitch: 1.2
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 0.6
    pitch: 1.2
  page:
    enabled: true
    sound: "item.book.page_turn"
    volume: 1.0
    pitch: 1.0
