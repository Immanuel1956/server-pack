# Teleport requests: /tpa, /tpahere, /tpahereall, /tpaccept, /tpdeny, /tpacancel,
# /tpatoggle [tpa|tpahere], /tpauto

prefix: "&#22AFFB&lTELEPORT &7▷ "

# Seconds before an unanswered request runs out.
expire-seconds: 60

# What players start with before they change it (in /settings or with the commands).
defaults:
  tpa: true        # receive /tpa requests
  tpahere: true    # receive /tpahere requests
  tpauto: false    # accept every request automatically

# The countdown of whoever teleports after a request is accepted. vexcore.tpa.bypass skips it.
teleport:
  delay-seconds: 5
  cancel-on-move: true
  cancel-on-damage: true

# %player% = the other player. %tpaccept% / %tpdeny% = those commands' current names, so
# the buttons keep working when they are renamed in commands.yml.
messages:
  sent: "{prefix}&fRequest sent to &#22AFFB%player%&f."
  sent-here: "{prefix}&fYou asked &#22AFFB%player% &fto come to you."
  received:
    - "{prefix}&#22AFFB%player% &fwants to teleport to you."
    - "<click:run_command:'/%tpaccept% %player%'><hover:show_text:'&aAccept the request'>&#16D223&l[ACCEPT]</hover></click> <click:run_command:'/%tpdeny% %player%'><hover:show_text:'&cDeny the request'>&#FF3B3B&l[DENY]</hover></click>"
  received-here:
    - "{prefix}&#22AFFB%player% &fwants you to teleport to them."
    - "<click:run_command:'/%tpaccept% %player%'><hover:show_text:'&aAccept the request'>&#16D223&l[ACCEPT]</hover></click> <click:run_command:'/%tpdeny% %player%'><hover:show_text:'&cDeny the request'>&#FF3B3B&l[DENY]</hover></click>"
  hereall: "{prefix}&fRequest sent to &#22AFFB%amount% &fplayers."
  accepted-sender: "{prefix}&#22AFFB%player% &faccepted your request."
  accepted-target: "{prefix}&fYou accepted the request from &#22AFFB%player%&f."
  denied-sender: "{prefix}&#22AFFB%player% &fdenied your request."
  denied-target: "{prefix}&fYou denied the request from &#22AFFB%player%&f."
  cancelled: "{prefix}&fYour request was cancelled."
  cancelled-target: "{prefix}&#22AFFB%player% &fcancelled their request."
  expired-sender: "{prefix}&fYour request to &#22AFFB%player% &fran out."
  expired-target: "{prefix}&fThe request from &#22AFFB%player% &fran out."
  auto-sender: "{prefix}&#22AFFB%player% &faccepts requests automatically."
  auto-target: "{prefix}&fAccepted the request from &#22AFFB%player% &fautomatically."
  teleport-countdown: "[actionbar]{prefix}&fTeleporting to &#22AFFB%player% &fin &#22AFFB%seconds%s"
  teleport-success: "[actionbar]{prefix}&fYou arrived at &#22AFFB%player%&f."
  teleport-cancelled: "{prefix}&fTeleport cancelled, you moved."
  teleport-failed: "&#FF0000&lERROR &7▷ &#22AFFB%player% &fcan't be reached right now."
  toggle-on: "{prefix}&fYou receive requests again."
  toggle-off: "{prefix}&fYou no longer receive any requests."
  tpa-toggle-on: "{prefix}&fYou receive &#22AFFB/tpa &frequests again."
  tpa-toggle-off: "{prefix}&fYou no longer receive &#22AFFB/tpa &frequests."
  tpahere-toggle-on: "{prefix}&fYou receive &#22AFFB/tpahere &frequests again."
  tpahere-toggle-off: "{prefix}&fYou no longer receive &#22AFFB/tpahere &frequests."
  auto-on: "{prefix}&fRequests are now accepted automatically."
  auto-off: "{prefix}&fRequests are no longer accepted automatically."
  target-restricted: "&#FF0000&lERROR &7▷ &#22AFFB%player% &fcan't teleport right now."
  self: "&#FF0000&lERROR &7▷ &fYou can't send a request to yourself."
  already-sent: "&#FF0000&lERROR &7▷ &fYou already have a request open with &#22AFFB%player%&f."
  target-blocked: "&#FF0000&lERROR &7▷ &#22AFFB%player% &fdoesn't take requests."
  player-offline: "&#FF0000&lERROR &7▷ &#22AFFB%player% &fis not online any more."
  no-request: "&#FF0000&lERROR &7▷ &fYou have no open request."

