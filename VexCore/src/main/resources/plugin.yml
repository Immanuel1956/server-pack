name: VexCore
version: '1.0.0'
main: com.vexorstudios.vexcore.VexCore
api-version: '1.21'
folia-supported: true
# STARTUP: enabled before every other plugin, so anything they look up while enabling (like
# the economy) is already there. Worlds load after this; VexCore never needs them at enable.
load: STARTUP
author: Vexor
website: https://vexorstudios.com
description: All-in-one survival core by VexorStudios.
softdepend: [Vault, LuckPerms, PlaceholderAPI, packetevents]

# No commands here: they come from commands.yml, so they can be renamed and turned off.
# VexCore checks permissions itself (see hide-commands-without-permission in config.yml).

permissions:
  vexcore.ranktrial:
    description: Grant an allowed temporary LuckPerms rank
    default: op

  vexcore.admin:
    description: /vexcore (reload, import, features, permissions, placeholders)
    default: op

