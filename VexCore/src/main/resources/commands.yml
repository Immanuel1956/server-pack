# Every command VexCore adds. The key (vexcore, spawn, ...) never changes; everything under
# it can:
#
#   enabled      false removes the command from the server
#   name         what players type. Rename freely: name: core turns /vexcore into /core
#   aliases      more names for the same command
#   permission   needed to use it; '' lets everyone use it
#   description  shown in /help
#   usage        sent when the command is used wrong; %command% is its current name
#
# A command also disappears when its feature is turned off in config.yml.
# If another plugin already has a name, VexCore takes it and gives it back when removed.
# Changes take effect on /vexcore reload.

