# Read by /vexcore placeholders and /vexcore permissions, and for permissions.txt and
# placeholders.txt in the plugin folder. Stays inside the jar: nothing to edit.
#
# Every permission in plugin.yml is listed from plugin.yml itself; below are only the ones VexCore
# builds from your settings. [x] stands for a part you fill in.

permission-patterns:
  - node: "vexcore.home.[number]"
    default: "nobody"
    feature: home
    description: "Up to that many homes (vexcore.home.5); the highest one counts"
  - node: "vexcore.pwarps.[number]"
    default: "nobody"
    feature: pwarps
    description: "Up to that many player warps (vexcore.pwarps.5)"
  - node: "vexcore.warp.[name]"
    default: "nobody"
    feature: warps
    description: "Use that server warp, when per-warp-permission is on"
  - node: "vexcore.kit.[kit]"
    default: "nobody"
    feature: kits
    description: "Claim that kit (a kit without its own permission: line)"
  - node: "[any permission you write in a config]"
    default: "nobody"
    feature: ""
    description: "permission: of a boost, kit, menu item or link, permission-homes, sell multipliers, command whitelist groups"

placeholders:
  core:
    - placeholder: "%vexcore_toggle_[id]%"
      description: "true/false for a /settings toggle: pay, msg, tpa, tpahere, tpauto, chat, mentions, scoreboard, nightvision, playerhide, mobtoggle, phantoms, joinmessages, deathmessages, live, coinflip"
  economy:
    - {placeholder: "%vexcore_balance%", description: "Balance, plain number (1500.25)"}
    - {placeholder: "%vexcore_balance_formatted%", description: "Balance with the currency ($1,500.25)"}
    - {placeholder: "%vexcore_balance_short%", description: "Balance short ($1.5k)"}
    - {placeholder: "%vexcore_baltop_name_[place]%", description: "Name at that place of /baltop (baltop_name_1)"}
    - {placeholder: "%vexcore_baltop_balance_[place]%", description: "Balance at that place of /baltop"}
  keyall:
    - {placeholder: "%vexcore_keyall%", description: "Time to the next key-all (42m 10s)"}
    - {placeholder: "%vexcore_keyall_countdown%", description: "Time to the next key-all as a clock (42:10, 1:02:03)"}
    - {placeholder: "%vexcore_keyall_seconds%", description: "Seconds to the next key-all"}
    - {placeholder: "%vexcore_keyall_minutes%", description: "Minutes to the next key-all, rounded up"}
    - {placeholder: "%vexcore_keyall_at%", description: "Clock time of the next key-all (18:00, placeholder.time-format)"}
    - {placeholder: "%vexcore_keyall_interval%", description: "How often key-alls happen (1h)"}
  home:
    - {placeholder: "%vexcore_homes%", description: "Homes the player has"}
    - {placeholder: "%vexcore_homes_max%", description: "Homes the player may have"}
