# ProGuard for VexCore. Used by the default build (see the obfuscate profile in pom.xml).
# Only VexCore's own classes are obfuscated; Paper, Vault, PlaceholderAPI and PacketEvents are
# passed in as libraries by the Maven plugin.

# The JDK modules VexCore uses.
-libraryjars <java.home>/jmods/java.base.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.sql.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.net.http.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.logging.jmod(!**.jar;!module-info.class)
# Tebex head art reads skins with ImageIO/BufferedImage (headless; no window is ever opened).
-libraryjars <java.home>/jmods/java.desktop.jmod(!**.jar;!module-info.class)

# Rename only. Optimizing has broken Bukkit plugins before (merged classes, inlined
# listeners) for a few percent of speed; the JIT does that work anyway.
-dontoptimize
-dontusemixedcaseclassnames
-repackageclasses 'com.vexorstudios.vexcore.v'
-allowaccessmodification

# Stack traces stay usable: line numbers are kept, and target/proguard-mapping.txt maps the
# names back (ProGuard's retrace tool).
-keepattributes Signature,InnerClasses,EnclosingMethod,Exceptions,Record,NestHost,NestMembers,PermittedSubclasses,SourceFile,LineNumberTable,*Annotation*
-renamesourcefileattribute VexCore

# The main class named in plugin.yml, and what other plugins call on it.
-keep public class com.vexorstudios.vexcore.VexCore {
    public *;
}

# Bukkit finds event handlers by their annotation.
-keepclassmembers class * implements org.bukkit.event.Listener {
    @org.bukkit.event.EventHandler *;
}

# Enum constants are stored in the database and matched against config text by name.
-keepclassmembers enum * {
    <fields>;
    public static **[] values();
    public static ** valueOf(java.lang.String);
}


# Loaded only when PlaceholderAPI or PacketEvents is installed; kept whole so nothing in them
# is folded into classes that load without those plugins.
-keep class com.vexorstudios.vexcore.core.Placeholders$Expansion { *; }
-keep class com.vexorstudios.vexcore.features.hide.HideFeature$PacketBridge { *; }
-keep class com.vexorstudios.vexcore.features.nametags.NametagsFeature$Mount { *; }

# Annotation-only libraries that Paper's API refers to but doesn't ship.
-dontwarn org.jetbrains.annotations.**
-dontwarn org.checkerframework.**
-dontwarn javax.annotation.**
-dontwarn com.google.errorprone.annotations.**
-dontwarn org.jspecify.annotations.**
-dontnote **
